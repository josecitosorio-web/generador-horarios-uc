<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo.png">
    <link rel="stylesheet" href="/css/lista-horario.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>KAIROS - VER HORARIO</title>
</head>

<body>

    <main>

        <div class="header">
            <div class="logo">

                <img src="/images/logo-head.png" alt="">
                <h1>KAIROS</h1>

            </div>
            <div class="user">

                <p th:text="|Hola, ${nombre}|"></p>
                <img src="/images/usuario.png" alt="">

            </div>


        </div>
        <div class="main-espacio">

            <div class="espacio-titulo">

                <h2>Hemos encontrado los 5 mejores horarios para ti</h2>
                <p>Ordenados por menor tiempo muerto</p>

            </div>

            <div class="horarios-lista">

                <div th:each="hora, estado : ${horas}" class="puesto">

                    <div class="numero" th:classappend="${estado.index == 0 ? 'uno' :
                      estado.index == 1 ? 'dos' :
                      estado.index == 2 ? 'tres' : ''}">

                        <p th:text="${estado.count}"></p>

                    </div>

                    <p class="horario-titulo">
                        Horario <span th:text="${'#' + estado.count}">
                    </p>

                    <div class="tiempo">
                        <p>Tiempo muerto total</p>
                        <p th:text="${hora + ' min'}"></p>
                    </div>

                    <div class="acciones">

                        <a th:href="@{/ver(posicion=${estado.index})}"><img src="/images/ojo-azul.png" alt="">Ver Horario</a>

                    </div>

                </div>

            </div>

            <div class="volver">

                <a th:href="@{/volver-cursos}">Volver a la seccion de Cursos</a>

            </div>

        </div>

    </main>

</body>

</html>
