<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo.png">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/cursos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <title>KAIROS - CURSOS</title>
</head>

<body>

    <div class="banner">

        <div class="logo">

            <img src="/images/logo.png" alt="imagen del logo de la marca">
            <p>Kairos</p>
            <p>|</p>
            <p>La forma inteligente de construir tu horario</p>

        </div>

    </div>

    <main>

        <div th:replace="fragments/menu :: menu"></div>
        <div class="dashboard-main">

            <div class="titulo">

                <h1>Gestión de Cursos</h1>
                <p>Administra los cursos disponibles en la oferta académica</p>

            </div>
            <div class="nuevo-curso espacio">

                <h2>Registrar Curso</h2>

                <form th:action="@{/curso/registrar}" method="post">

                    <input type="hidden" name="id" th:value="${curso != null ? curso.id : ''}">

                    <div class="input">

                        <label for="codigo">Código</label>
                        <input type="text" id="codigo" placeholder="Ej: ASUC000" name="codigo" th:value="${curso != null ? curso.codigo : ''}" required>

                    </div>
                    <div class="input">

                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej: Arquitectura Empresarial" name="nombre" th:value="${curso != null ? curso.nombre : ''}" required>

                    </div>
                    <div class="input">

                        <label for="creditos">Créditos</label>
                        <input type="number" id="creditos" placeholder="Ej: 4" name="creditos" th:value="${ curso != null ? curso.creditos : ''}" required>

                    </div>

                    <button class="button" type="submit"><img src="/images/agregar.png" alt="">Guardar Curso</button>

                </form>

            </div>
            <div class="cursos espacio">

                <h2>Lista de Cursos</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Creditos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="curso : ${cursos}">
                            <td th:text="${curso.codigo}"></td>
                            <td th:text="${curso.nombre}"></td>
                            <td th:text="${curso.creditos}"></td>
                            <td class="acciones"><a th:href="@{/curso/editar(id=${curso.id})}" class="boton editar"><img src="/images/editar.png" alt=""></a> <a th:href="@{/curso/eliminar(id=${curso.id})}" class="boton borrar"><img src="/images/eliminar.png" alt=""></a></td>
                        </tr>
                    </tbody>

                </table>

            </div>


        </div>

    </main>


</body>

</html>
